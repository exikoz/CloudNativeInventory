name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore CloudNativeInventory.sln

      - name: Build project
        run: dotnet build CloudNativeInventory.sln --no-restore -c Release

      - name: Run tests
        run: dotnet test CloudNativeInventory.sln --no-build -c Release

  build-and-push-docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: acrcloudnativehh.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t acrcloudnativehh.azurecr.io/inventory-api:${{ github.sha }} -f CloudNativeInventory.Api/Dockerfile .
          docker push acrcloudnativehh.azurecr.io/inventory-api:${{ github.sha }}