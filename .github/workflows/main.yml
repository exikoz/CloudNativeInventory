name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore CloudNativeInventory.slnx

      - name: Build project
        run: dotnet build CloudNativeInventory.slnx --no-restore -c Release

      - name: Run tests
        run: dotnet test CloudNativeInventory.slnx --no-build -c Release

  build-and-push-docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: acrcloudnativehh.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t acrcloudnativehh.azurecr.io/inventory-api:${{ github.sha }} -f CloudNativeInventory.Api/Dockerfile .
          docker push acrcloudnativehh.azurecr.io/inventory-api:${{ github.sha }}

  deploy:
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ${{ secrets.AZURE_CONTAINER_APP }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --image acrcloudnativehh.azurecr.io/inventory-api:${{ github.sha }}